name: Test J2ME Go proxy protocol

on:
  push:
    branches: [J2ME]
    paths:
      - "go-proxy/**"
      - ".github/workflows/test-go-proxy-j2me.yml"
  pull_request:
    branches: [J2ME]
    paths:
      - "go-proxy/**"
      - ".github/workflows/test-go-proxy-j2me.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-go-proxy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache-dependency-path: go-proxy/go.mod
      - name: Check formatting
        run: |
          gofmt -d go-proxy/*.go
          gofmt -l go-proxy/*.go
          test -z "$(gofmt -l go-proxy/*.go)"
      - name: Test
        working-directory: go-proxy
        run: go test ./...
      - name: Build
        working-directory: go-proxy
        run: go build ./...
