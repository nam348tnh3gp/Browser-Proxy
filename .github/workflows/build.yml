name: Build TGFN.BrowserMini

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle -p android-app assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TGFN-BrowserMini-debug-apk
          path: android-app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  go-proxy:
    name: Test Go proxy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache-dependency-path: go-proxy/go.mod
      - name: Format check
        run: test -z "$(gofmt -l go-proxy/*.go)"
      - name: Test
        working-directory: go-proxy
        run: go test ./...
      - name: Build
        working-directory: go-proxy
        run: |
          mkdir -p ../dist
          go build -trimpath -ldflags="-s -w" -o ../dist/tgfn-browsermini-proxy .
