name: Build TGFN.BrowserMini

on:
  push:
    branches: [main]
    paths:
      - "android-app/**"
      - "go-proxy/**"
      - ".github/workflows/build.yml"
  pull_request:
    branches: [main]
    paths:
      - "android-app/**"
      - "go-proxy/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: write

# Avoid concurrent version-bump commits racing against main.
concurrency:
  group: browser-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Load version from files
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION_NAME="$(tr -d '\r\n' < versionname.txt)"
          VERSION_CODE="$(tr -d '\r\n' < versioncode.txt)"
          [[ "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid versionname.txt: $VERSION_NAME" >&2; exit 1; }
          [[ "$VERSION_CODE" =~ ^[0-9]+$ ]] || { echo "Invalid versioncode.txt: $VERSION_CODE" >&2; exit 1; }
          VERSION_CODE=$((10#$VERSION_CODE))
          python3 - "$VERSION_NAME" "$VERSION_CODE" <<'PY'
          import pathlib, re, sys
          path = pathlib.Path("android-app/app/build.gradle.kts")
          text = path.read_text()
          name, code = sys.argv[1], int(sys.argv[2])
          text, n_code = re.subn(r'(?m)^(\s*versionCode\s*=\s*)\d+\s*$', rf'\g<1>{code}', text, count=1)
          text, n_name = re.subn(r'(?m)^(\s*versionName\s*=\s*")[^"]+("\s*)$', rf'\g<1>{name}\2', text, count=1)
          if n_code != 1 or n_name != 1:
              raise SystemExit("Could not set versionCode/versionName in build.gradle.kts")
          path.write_text(text)
          PY
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "Building versionName=$VERSION_NAME versionCode=$VERSION_CODE"

      - name: Prepare release signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            if [ -n "$KEYSTORE_PASSWORD$KEY_ALIAS$KEY_PASSWORD" ]; then
              echo "Signing secrets are incomplete: provide all four ANDROID_* secrets." >&2
              exit 1
            fi
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "No signing keystore configured; will build a debug APK."
            exit 0
          fi
          if [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "Signing keystore exists but one or more signing secrets are missing." >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/android-signing"
          KEYSTORE_FILE="$RUNNER_TEMP/android-signing/release.jks"
          # GitHub secrets may contain line wrapping/whitespace; remove it before decoding.
          if ! printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$KEYSTORE_FILE"; then
            rm -f "$KEYSTORE_FILE"
            echo "ANDROID_KEYSTORE_BASE64 is not valid Base64. Re-create it from the .jks file and update the repository secret." >&2
            exit 1
          fi
          if [ ! -s "$KEYSTORE_FILE" ]; then
            echo "Decoded keystore is empty; check ANDROID_KEYSTORE_BASE64." >&2
            exit 1
          fi
          if ! keytool -list -keystore "$KEYSTORE_FILE" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            rm -f "$KEYSTORE_FILE"
            echo "Decoded keystore is invalid, password is wrong, or ANDROID_KEY_ALIAS does not exist in this keystore." >&2
            exit 1
          fi
          echo "available=true" >> "$GITHUB_OUTPUT"
          echo "ANDROID_KEYSTORE_FILE=$KEYSTORE_FILE" >> "$GITHUB_ENV"

      - name: Build signed release APK
        if: steps.signing.outputs.available == 'true'
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle -p android-app assembleRelease

      - name: Build debug APK (signing not configured)
        if: steps.signing.outputs.available != 'true'
        run: gradle -p android-app assembleDebug

      - name: Upload signed release APK
        if: steps.signing.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: TGFN-BrowserMini-release-v${{ steps.version.outputs.version_name }}-${{ steps.version.outputs.version_code }}
          path: android-app/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload debug APK
        if: steps.signing.outputs.available != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: TGFN-BrowserMini-debug-v${{ steps.version.outputs.version_name }}-${{ steps.version.outputs.version_code }}
          path: android-app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      # Increment only after a successful APK build. A rerun of an older workflow
      # has GITHUB_SHA != origin/main and therefore cannot bump the counter again.
      - name: Increment version code after successful build
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_RUN_ATTEMPT:-1}" -gt 1 ]; then
            echo "Skipping version-code increment: workflow rerun attempt ${GITHUB_RUN_ATTEMPT}."
            exit 0
          fi
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo "Skipping version-code increment: this is a rerun or main has advanced."
            exit 0
          fi
          CURRENT_CODE="$(tr -d '\r\n' < versioncode.txt)"
          [[ "$CURRENT_CODE" =~ ^[0-9]+$ ]] || { echo "Invalid versioncode.txt" >&2; exit 1; }
          NEXT_CODE=$((10#$CURRENT_CODE + 1))
          printf '%s\n' "$NEXT_CODE" > versioncode.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add versioncode.txt
          git commit -m "chore(version): increment version code to $NEXT_CODE [skip ci]"
          git push origin HEAD:main

  go-proxy:
    name: Test Go proxy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache-dependency-path: go-proxy/go.mod
      - name: Format check
        run: |
          gofmt -d go-proxy/*.go
          gofmt -l go-proxy/*.go
          test -z "$(gofmt -l go-proxy/*.go)"
      - name: Test
        working-directory: go-proxy
        run: go test -race ./...
      - name: Vet
        working-directory: go-proxy
        run: go vet ./...
      - name: Build
        working-directory: go-proxy
        run: |
          mkdir -p ../dist
          go build -trimpath -ldflags="-s -w" -o ../dist/tgfn-browsermini-proxy .
