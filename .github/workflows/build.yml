name: Build and Release TGFN.BrowserMini

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tgfn-browsermini-release
  cancel-in-progress: false

jobs:
  release:
    name: Build signed APK and publish GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Prevent accidental release on workflow rerun
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_RUN_ATTEMPT:-1}" -gt 1 ]; then
            echo "This is a workflow rerun. Start a new workflow run to release the next version." >&2
            exit 1
          fi

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validate version and signing configuration
        id: version
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION_NAME="$(tr -d '\r\n' < versionname.txt)"
          VERSION_CODE="$(tr -d '\r\n' < versioncode.txt)"
          [[ "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid versionname.txt: $VERSION_NAME" >&2; exit 1; }
          [[ "$VERSION_CODE" =~ ^[0-9]+$ ]] || { echo "Invalid versioncode.txt: $VERSION_CODE" >&2; exit 1; }
          VERSION_CODE=$((10#$VERSION_CODE))

          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "A signed release requires all four ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD repository secrets." >&2
            exit 1
          fi

          GRADLE_FILE="android-app/app/build.gradle.kts"
          grep -Eq "^[[:space:]]*versionCode[[:space:]]*=[[:space:]]*$VERSION_CODE[[:space:]]*$" "$GRADLE_FILE" || {
            echo "build.gradle.kts versionCode does not match versioncode.txt; sync and commit the files before releasing." >&2
            exit 1
          }
          grep -Fq "versionName = \"$VERSION_NAME\"" "$GRADLE_FILE" || {
            echo "build.gradle.kts versionName does not match versionname.txt; sync and commit the files before releasing." >&2
            exit 1
          }

          TAG="v$VERSION_NAME"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Update version files before creating another release." >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists. Update version files before creating another release." >&2
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/android-signing"
          KEYSTORE_FILE="$RUNNER_TEMP/android-signing/release.jks"
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$KEYSTORE_FILE"
          test -s "$KEYSTORE_FILE"
          keytool -list -keystore "$KEYSTORE_FILE" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          echo "ANDROID_KEYSTORE_FILE=$KEYSTORE_FILE" >> "$GITHUB_ENV"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Confirm release source is current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "main advanced during this run. Start a fresh workflow run." >&2
            exit 1
          fi

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle -p android-app assembleRelease

      - name: Verify APK output
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find android-app/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK" && test -s "$APK"
          APKSIGNER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -type f -name apksigner -print -quit)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify "$APK"
          echo "path=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: TGFN-BrowserMini-release-v${{ steps.version.outputs.version_name }}-${{ steps.version.outputs.version_code }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "${{ steps.version.outputs.tag }}" "${{ steps.apk.outputs.path }}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$(git rev-parse HEAD)" \
            --title "TGFN.BrowserMini ${{ steps.version.outputs.tag }}" \
            --generate-notes

      - name: Increment version name and code after successful release
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import pathlib
          import re

          name_path = pathlib.Path("versionname.txt")
          code_path = pathlib.Path("versioncode.txt")
          gradle_path = pathlib.Path("android-app/app/build.gradle.kts")

          version = name_path.read_text().strip()
          match = re.fullmatch(r"(\d+)\.(\d+)\.(\d+)", version)
          if not match:
              raise SystemExit(f"Invalid version name: {version}")
          major, minor, patch = map(int, match.groups())
          next_name = f"{major}.{minor}.{patch + 1}"

          code_text = code_path.read_text().strip()
          if not code_text.isdigit():
              raise SystemExit(f"Invalid version code: {code_text}")
          next_code = int(code_text) + 1

          gradle = gradle_path.read_text()
          gradle, n_code = re.subn(
              r"(?m)^(\s*versionCode\s*=\s*)\d+\s*$",
              lambda m: m.group(1) + str(next_code),
              gradle,
              count=1,
          )
          gradle, n_name = re.subn(
              r'(?m)^(\s*versionName\s*=\s*")[^"]+("\s*)$',
              lambda m: m.group(1) + next_name + m.group(2),
              gradle,
              count=1,
          )
          if n_code != 1 or n_name != 1:
              raise SystemExit("Could not update versionCode/versionName in build.gradle.kts")

          name_path.write_text(next_name + "\n")
          code_path.write_text(str(next_code) + "\n")
          gradle_path.write_text(gradle)
          print(f"Next development version: {next_name} (versionCode {next_code})")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add versionname.txt versioncode.txt android-app/app/build.gradle.kts
          git commit -m "chore(version): prepare next version [skip ci]"
          git push origin HEAD:main
