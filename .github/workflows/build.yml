name: Build TGFN.BrowserMini

on:
  push:
    branches: [main]
    paths:
      - "android-app/**"
      - "go-proxy/**"
      - ".github/workflows/build.yml"
  pull_request:
    branches: [main]
    paths:
      - "android-app/**"
      - "go-proxy/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: write

# Avoid concurrent version-bump commits racing against main.
concurrency:
  group: browser-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Bump Android version
        id: version
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib
          import re

          path = pathlib.Path("android-app/app/build.gradle.kts")
          text = path.read_text()
          code_match = re.search(r'(?m)^\s*versionCode\s*=\s*(\d+)\s*$', text)
          name_match = re.search(r'(?m)^\s*versionName\s*=\s*"([0-9]+)\.([0-9]+)\.([0-9]+)"\s*$', text)
          if not code_match or not name_match:
              raise SystemExit("Cannot parse versionCode/versionName in build.gradle.kts")

          version_code = int(code_match.group(1)) + 1
          major, minor, patch = map(int, name_match.groups())
          version_name = f"{major}.{minor}.{patch + 1}"
          text = re.sub(r'(?m)^(\s*versionCode\s*=\s*)\d+\s*$', rf'\g<1>{version_code}', text, count=1)
          text = re.sub(r'(?m)^(\s*versionName\s*=\s*")[0-9]+\.[0-9]+\.[0-9]+("\s*)$', rf'\g<1>{version_name}\2', text, count=1)
          path.write_text(text)
          print(f"versionCode={version_code}")
          print(f"versionName={version_name}")
          with open(__import__("os").environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"version_code={version_code}\n")
              out.write(f"version_name={version_name}\n")
          PY

      - name: Commit version bump to main
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android-app/app/build.gradle.kts
          if ! git diff --cached --quiet; then
            git commit -m "chore(android): bump version to ${{ steps.version.outputs.version_name }} [skip ci]"
            git push origin HEAD:main
          fi

      - name: Prepare release signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            if [ -n "$KEYSTORE_PASSWORD$KEY_ALIAS$KEY_PASSWORD" ]; then
              echo "Signing secrets are incomplete: provide all four ANDROID_* secrets." >&2
              exit 1
            fi
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "No signing keystore configured; will build a debug APK."
            exit 0
          fi
          if [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "Signing keystore exists but one or more signing secrets are missing." >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/android-signing"
          KEYSTORE_FILE="$RUNNER_TEMP/android-signing/release.jks"
          # GitHub secrets may contain line wrapping/whitespace; remove it before decoding.
          if ! printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$KEYSTORE_FILE"; then
            rm -f "$KEYSTORE_FILE"
            echo "ANDROID_KEYSTORE_BASE64 is not valid Base64. Re-create it from the .jks file and update the repository secret." >&2
            exit 1
          fi
          if [ ! -s "$KEYSTORE_FILE" ]; then
            echo "Decoded keystore is empty; check ANDROID_KEYSTORE_BASE64." >&2
            exit 1
          fi
          if ! keytool -list -keystore "$KEYSTORE_FILE" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            rm -f "$KEYSTORE_FILE"
            echo "Decoded keystore is invalid, password is wrong, or ANDROID_KEY_ALIAS does not exist in this keystore." >&2
            exit 1
          fi
          echo "available=true" >> "$GITHUB_OUTPUT"
          echo "ANDROID_KEYSTORE_FILE=$KEYSTORE_FILE" >> "$GITHUB_ENV"

      - name: Build signed release APK
        if: steps.signing.outputs.available == 'true'
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle -p android-app assembleRelease

      - name: Build debug APK (signing not configured)
        if: steps.signing.outputs.available != 'true'
        run: gradle -p android-app assembleDebug

      - name: Upload signed release APK
        if: steps.signing.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: TGFN-BrowserMini-release-v${{ steps.version.outputs.version_name }}
          path: android-app/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload debug APK
        if: steps.signing.outputs.available != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: TGFN-BrowserMini-debug-v${{ steps.version.outputs.version_name }}
          path: android-app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  go-proxy:
    name: Test Go proxy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache-dependency-path: go-proxy/go.mod
      - name: Format check
        run: |
          gofmt -d go-proxy/main.go
          gofmt -l go-proxy/*.go
          test -z "$(gofmt -l go-proxy/*.go)"
      - name: Test
        working-directory: go-proxy
        run: go test -race ./...
      - name: Vet
        working-directory: go-proxy
        run: go vet ./...
      - name: Build
        working-directory: go-proxy
        run: |
          mkdir -p ../dist
          go build -trimpath -ldflags="-s -w" -o ../dist/tgfn-browsermini-proxy .
