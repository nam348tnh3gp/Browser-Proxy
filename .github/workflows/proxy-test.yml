name: Test Go Proxy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tgfn-go-proxy-tests
  cancel-in-progress: true

jobs:
  test:
    name: Format, test, vet and build Go proxy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache-dependency-path: go-proxy/go.mod

      - name: Format check
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(gofmt -l go-proxy/*.go)"

      - name: Unit tests with race detector
        working-directory: go-proxy
        run: go test -race ./...

      - name: Vet
        working-directory: go-proxy
        run: go vet ./...

      - name: Build proxy
        working-directory: go-proxy
        run: go build -trimpath -ldflags="-s -w" -o /tmp/tgfn-browsermini-proxy .
