name: Build TGFN BrowserMini J2ME

on:
  push:
    branches: [main]
    paths:
      - "j2me/**"
      - ".github/workflows/build-j2me.yml"
  pull_request:
    paths:
      - "j2me/**"
      - ".github/workflows/build-j2me.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-j2me:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: j2me
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Build J2ME JAR
        run: mvn --batch-mode --no-transfer-progress clean package
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: TGFN-BrowserMini-J2ME
          path: j2me/target/TGFN-BrowserMini-J2ME.jar
          if-no-files-found: error
          retention-days: 14
